%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      # Measured on an LG V30: 64 at 10 bits (short exposures, gain 0)
      blackLevel: 4096
  - Awb:
  - Ccm:
      # LG's own colour correction for this sensor, from the ISP tuning
      # in the LG V30's libchromatix_imx351_preview.so. It holds four
      # distinct matrices (one is a desaturated low-light copy); the
      # three below are placed by strength: tungsten, fluorescent,
      # daylight. Not yet checked against a colour chart.
      ccms:
        - ct: 2856
          ccm: [  1.8256, -0.9652,  0.1397,
                 -0.2079,  1.2506, -0.0424,
                 -0.0491, -1.3725,  2.4216 ]
        - ct: 4000
          ccm: [  1.8041, -0.8873,  0.0832,
                 -0.2731,  1.3270, -0.0539,
                 -0.0505, -0.8616,  1.9121 ]
        - ct: 6500
          ccm: [  1.7199, -0.7524,  0.0325,
                 -0.1651,  1.3173, -0.1522,
                 -0.0140, -0.8976,  1.9115 ]
  - Adjust:
  - Agc:
...
