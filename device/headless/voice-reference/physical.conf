# Explicit ALSA endpoints for a temporary V30 call session. No desktop or discovery.
# Launch only after the microphone, mixer routes and physical-test gates pass.
context.properties = {
 core.daemon = true
 core.name = pipewire-0
 default.clock.rate = 48000
 default.clock.allowed-rates = [ 48000 ]
 default.clock.quantum = 480
}
context.spa-libs = {
 audio.convert.* = audioconvert/libspa-audioconvert
 api.alsa.* = alsa/libspa-alsa
 support.* = support/libspa-support
}
context.modules = [
 { name = libpipewire-module-protocol-native }
 { name = libpipewire-module-metadata }
 { name = libpipewire-module-client-node }
 { name = libpipewire-module-spa-node-factory }
 { name = libpipewire-module-adapter }
 { name = libpipewire-module-link-factory }
 { name = libpipewire-module-access args = { access.legacy = true } }
]
context.objects = [
 { factory = adapter args = {
   factory.name = api.alsa.pcm.source
   node.name = v30-call-microphone
   media.class = Audio/Source
   api.alsa.path = "hw:LGV30,0"
   audio.format = S16LE
   audio.rate = 48000
   audio.channels = 1
   audio.position = [ MONO ]
   node.suspend-on-idle = true
   adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
 } }
 { factory = adapter args = {
   factory.name = api.alsa.pcm.sink
   node.name = v30-call-speaker
   media.class = Audio/Sink
   api.alsa.path = "hw:LGV30,1"
   audio.format = S16LE
   audio.rate = 48000
   audio.channels = 2
   audio.position = [ FL FR ]
   node.suspend-on-idle = true
   adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
 } }
]
